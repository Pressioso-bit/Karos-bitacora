name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://ntfy.sh/karos-6b186cd3ab/json?poll=1&since=2h" | python3 -c "
          import sys,json,datetime
          for l in sys.stdin:
              j=json.loads(l)
              t=datetime.datetime.utcfromtimestamp(j['time']-3*3600).strftime('%H:%M')
              print('MSG',t,j.get('event'),j.get('sequence_id'),j.get('title'),'|',j.get('message'))
          "

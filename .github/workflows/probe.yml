name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "TABM $(curl -s https://pressioso-bit.github.io/Karos-bitacora/ | grep -c 'tab-m')"
          echo "IMG $(curl -s -o /dev/null -w '%{http_code}' https://pressioso-bit.github.io/Karos-bitacora/mapas/tempteroon.jpg)"
          echo "PLACES $(curl -s https://pressioso-bit.github.io/Karos-bitacora/data.json | grep -c 'pl-hada1')"
          curl -sI https://pressioso-bit.github.io/Karos-bitacora/ | grep -i "cache-control\|last-modified\|age:"

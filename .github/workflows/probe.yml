name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          T=karos-probe-$RANDOM$RANDOM
          curl -s -H "At: 1m" -H "X-Sequence-ID: aaa" -d "A should NOT arrive" https://ntfy.sh/$T >/dev/null
          curl -s -H "At: 1m" -H "X-Sequence-ID: bbb" -d "B first version" https://ntfy.sh/$T >/dev/null
          curl -s -H "At: 1m" -d "C control" https://ntfy.sh/$T >/dev/null
          sleep 3
          curl -s -o /dev/null -w "delete A: %{http_code}\n" -X DELETE https://ntfy.sh/$T/aaa
          curl -s -H "At: 2m" -H "X-Sequence-ID: bbb" -d "B second version" https://ntfy.sh/$T >/dev/null
          sleep 150
          echo "== delivered messages"
          curl -s "https://ntfy.sh/$T/json?poll=1&since=all" | python3 -c "import sys,json;[print(j.get('event'),j.get('sequence_id'),j.get('message')) for j in map(json.loads,sys.stdin)]"
